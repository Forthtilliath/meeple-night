version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      # From 13, the Linux binary needs glibc 2.34: too recent for some panel hosts (KataBump).
      - dependency-name: better-sqlite3
        update-types: ['version-update:semver-major']
    groups:
      dependencies:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    groups:
      docker:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
